<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robin Hood</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0ede6;
            color: #2e2820;
            padding: 16px 12px;
            display: flex;
            justify-content: center;
        }
        
        .container { 
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }
        
        header {
            background: linear-gradient(135deg, #2D5016 0%, #1a3009 100%);
            color: white;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        
        header h1 { 
            font-size: 22px; 
            font-weight: 600; 
            margin-bottom: 6px;
        }
        
        .month-range {
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            display: inline-block;
        }
        
        /* 3-Column Summary Layout */
        .summary {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .stat-card {
            background: white;
            padding: 12px 8px;
            border-radius: 8px;
            border: 1px solid #d4c8ba;
            text-align: center;
        }
        
        .stat-label { 
            font-size: 11px; 
            color: #6e5e4d; 
            margin-bottom: 4px; 
            text-transform: uppercase;
            letter-spacing: 0.3px;
            line-height: 1.2;
        }
        .stat-value { font-size: 16px; font-weight: 700; }
        .stat-value.positive { color: #2e6622; }
        .stat-value.negative { color: #8a3311; }
        .stat-value.neutral { color: #5a4a34; }
        
        .balance-card {
            background: #ffffff;
            padding: 16px;
            border-radius: 8px;
            border: 2px solid #8B6F47;
            margin-bottom: 14px;
        }
        
        .balance-label { font-size: 12px; color: #6e5e4d; margin-bottom: 6px; text-transform: uppercase; }
        .balance-value { font-size: 30px; font-weight: 700; }
        .balance-value.positive { color: #2e6622; }
        .balance-value.negative { color: #8a3311; }

        .cc-tracker-card {
            background: #fbf9f6;
            border: 1px solid #c9baa7;
            border-left: 4px solid #8B6F47;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 14px;
        }
        
        .cc-tracker-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }
        
        .cc-tracker-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            color: #5a4a34;
            letter-spacing: 0.5px;
        }
        
        .cc-progress-badge {
            font-size: 14px;
            font-weight: 700;
        }
        
        .cc-tracker-subtext {
            font-size: 12px;
            color: #6e5e4d;
            display: flex;
            justify-content: space-between;
            border-top: 1px dashed #d4c8ba;
            padding-top: 6px;
            margin-top: 6px;
        }
        
        .form-section, .recent-section, .settings-section {
            background: white;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #d4c8ba;
            margin-bottom: 14px;
        }
        
        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #403222;
        }
        
        .form-group {
            margin-bottom: 12px;
            width: 100%;
            overflow: hidden;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #5a4a34;
        }
        
        input, select, textarea {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            padding: 10px;
            border: 1px solid #c9baa7;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
            background-color: #fff;
            box-sizing: border-box;
        }
        
        input[type="date"] {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            display: block;
            margin: 0;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        input[type="date"]::-webkit-date-and-time-value {
            text-align: left;
            width: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            min-height: 1.2em;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2D5016;
            box-shadow: 0 0 0 2px rgba(45, 80, 22, 0.15);
        }
        
        textarea { resize: vertical; min-height: 60px; }
        
        button {
            width: 100%;
            padding: 11px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s ease, transform 0.1s ease;
        }
        
        button:active { transform: scale(0.99); }
        
        .btn-primary {
            background: #2D5016;
            color: white;
            margin-top: 4px;
        }
        
        .btn-primary:hover { background: #233f11; }
        
        .btn-secondary {
            background: #eae3d8;
            color: #403222;
            margin-top: 8px;
        }
        
        .btn-secondary:hover { background: #dfd5c7; }
        
        .btn-toggle-view {
            background: transparent;
            color: #8B6F47;
            border: 1px dashed #d4c8ba;
            margin-top: 10px;
            padding: 8px 12px;
            font-size: 13px;
        }
        
        .btn-toggle-view:hover { background: #faf8f5; border-color: #8B6F47; }
        
        .transaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ede6dc;
            font-size: 14px;
        }
        
        .transaction:last-child { border-bottom: none; }
        
        .transaction-info { flex: 1; padding-right: 10px; }
        .transaction-category { font-weight: 500; color: #332719; }
        .transaction-date { font-size: 12px; color: #8a7a68; margin-top: 2px; }
        
        .badge {
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: 600;
            margin-left: 6px;
            vertical-align: middle;
            text-transform: uppercase;
        }
        
        .badge-cc {
            background: #fdf3e7;
            color: #a85817;
            border: 1px solid #f3d2b2;
        }

        .badge-bank {
            background: #f1f3ed;
            color: #4b663b;
            border: 1px solid #d4decb;
        }
        
        .transaction-notes {
            font-size: 11px;
            color: #6e5e4d;
            font-style: italic;
            margin-top: 3px;
            word-break: break-word;
        }
        
        .transaction-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .transaction-amount { font-weight: 600; white-space: nowrap; }
        .transaction-amount.income { color: #2e6622; }
        .transaction-amount.spending { color: #8a3311; }
        
        .btn-delete {
            width: auto;
            padding: 4px 8px;
            font-size: 12px;
            color: #8a7a68;
            background: #faf8f5;
            border: 1px solid #d4c8ba;
            border-radius: 4px;
            cursor: pointer;
            line-height: 1;
        }
        
        .btn-delete:hover {
            color: #8a3311;
            background: #fce4e4;
            border-color: #e0b0b0;
        }
        
        details.settings-section summary {
            font-size: 14px;
            font-weight: 600;
            color: #403222;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        details.settings-section summary::-webkit-details-marker { display: none; }
        
        details.settings-section summary::after {
            content: '▼';
            font-size: 12px;
            color: #8B6F47;
            transition: transform 0.2s;
        }
        
        details[open].settings-section summary::after {
            transform: rotate(180deg);
        }
        
        .settings-body {
            margin-top: 14px;
            border-top: 1px solid #ede6dc;
            padding-top: 14px;
        }
        
        .message {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 13px;
            display: none;
        }
        
        .message.error {
            background: #FCE4E4;
            color: #8a3311;
            border: 1px solid #e0b0b0;
            display: block;
        }
        
        .message.success {
            background: #E8F3E1;
            color: #2e6622;
            border: 1px solid #b2d4a5;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏹 Robin Hood</h1>
            <div class="month-range" id="monthRange">Loading...</div>
        </header>
        
        <!-- Updated 3-stat summary row -->
        <div class="summary">
            <div class="stat-card">
                <div class="stat-label">Total Income</div>
                <div class="stat-value positive" id="totalIncome">£0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Bank Outflow</div>
                <div class="stat-value negative" id="bankSpending">£0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Spend</div>
                <div class="stat-value neutral" id="totalSpending">£0.00</div>
            </div>
        </div>
        
        <div class="balance-card">
            <div class="balance-label">Cash-in-Bank Balance (Income − Bank Outflow)</div>
            <div class="balance-value positive" id="balanceValue">£0.00</div>
        </div>

        <div class="cc-tracker-card">
            <div class="cc-tracker-header">
                <div class="cc-tracker-title">Credit Card Progress</div>
                <div class="cc-progress-badge" id="ccProgress">£0.00</div>
            </div>
            <div id="ccStatus" style="font-size: 12px; font-weight: 500;">No activity</div>
            <div class="cc-tracker-subtext">
                <span>Total Repayments: <strong id="ccTotalRepaid">£0.00</strong></span>
                <span>New CC Spend: <strong id="ccTotalSpent">£0.00</strong></span>
            </div>
        </div>
        
        <div class="form-section">
            <div class="section-title">Add Transaction</div>
            <div id="message" class="message"></div>
            
            <div class="form-group">
                <label for="type">Type</label>
                <select id="type" onchange="updateCategories()">
                    <option value="income">Income</option>
                    <option value="spending" selected>Spending</option>
                </select>
            </div>

            <div class="form-group" id="paymentMethodGroup">
                <label for="paymentMethod">Paid Via</label>
                <select id="paymentMethod" onchange="handlePaymentMethodChange()">
                    <option value="bank" selected>Debit / Bank Account</option>
                    <option value="cc">Credit Card</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category"></select>
            </div>
            
            <div class="form-group">
                <label for="amount">Amount (£)</label>
                <input type="number" id="amount" placeholder="0.00" step="0.01" min="0" inputmode="decimal">
            </div>
            
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date">
            </div>
            
            <div class="form-group">
                <label for="notes">Notes (optional)</label>
                <textarea id="notes" placeholder="Optional notes..."></textarea>
            </div>
            
            <button class="btn-primary" onclick="addTransaction()">Add Transaction</button>
            <button class="btn-secondary" onclick="exportToCSV()">Export Unsynced to CSV</button>
        </div>
        
        <div class="recent-section">
            <div class="section-title">Transactions</div>
            <div id="recentList"></div>
            <button id="btnToggleAll" class="btn-toggle-view" style="display: none;" onclick="toggleShowAll()"></button>
        </div>
        
        <details class="settings-section">
            <summary>⚙️ Settings</summary>
            <div class="settings-body">
                <div class="form-group">
                    <label for="monthStartDay">Month Start Day (1–28)</label>
                    <input type="number" id="monthStartDay" min="1" max="28" value="1">
                </div>
                <button class="btn-primary" onclick="saveSettings()">Save Settings</button>
            </div>
        </details>
    </div>
    
    <script>
        const DB_NAME = 'FinanceTrackerDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'transactions';
        
        let db;
        let showAllTransactions = false;

        const categories = {
            income: ['Salary', 'Other'],
            spending: [
                'Joint Account',
                'Supermarket',
                'Family',
                'Travel',
                'Treat',
                'Credit Card Repayment',
                'Other Debt / Loans',
                'Other'
            ]
        };
        
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve();
                };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    }
                };
            });
        }
        
        function getMonthDates() {
            let startDay = parseInt(localStorage.getItem('monthStartDay'), 10) || 1;
            if (startDay > 28) startDay = 28;
            
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            
            let monthStart = new Date(year, month, startDay, 0, 0, 0, 0);
            
            if (now < monthStart) {
                monthStart = new Date(year, month - 1, startDay, 0, 0, 0, 0);
            }
            
            let monthEnd = new Date(monthStart);
            monthEnd.setMonth(monthEnd.getMonth() + 1);
            monthEnd.setMilliseconds(-1);
            
            return { start: monthStart, end: monthEnd };
        }
        
        function updateMonthRange() {
            const { start, end } = getMonthDates();
            const options = { month: 'short', day: 'numeric' };
            const startStr = start.toLocaleDateString('en-GB', options);
            const endStr = end.toLocaleDateString('en-GB', { ...options, year: 'numeric' });
            document.getElementById('monthRange').textContent = `${startStr} – ${endStr}`;
        }
        
        function showMessage(text, isError = false) {
            const msg = document.getElementById('message');
            msg.className = `message ${isError ? 'error' : 'success'}`;
            msg.textContent = text;
            setTimeout(() => {
                msg.className = 'message';
                msg.textContent = '';
            }, 3000);
        }

        function toggleShowAll() {
            showAllTransactions = !showAllTransactions;
            refreshViews();
        }

        function handlePaymentMethodChange() {
            const method = document.getElementById('paymentMethod').value;
            const categorySelect = document.getElementById('category');
            
            if (method === 'cc' && (categorySelect.value === 'Credit Card Repayment' || categorySelect.value === 'Other Debt / Loans')) {
                categorySelect.value = 'Supermarket';
            }
        }
        
        async function refreshViews() {
            const { start, end } = getMonthDates();
            const tx = db.transaction([STORE_NAME], 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const request = store.getAll();
            
            request.onsuccess = () => {
                const all = request.result;
                
                const activeInRange = all.filter(t => {
                    if (t.deleted) return false;
                    const d = new Date(t.date);
                    return d >= start && d <= end;
                });
                
                let income = 0;
                let bankSpending = 0;
                let totalSpending = 0;

                let ccRepayments = 0;
                let ccPurchases = 0;
                
                activeInRange.forEach(t => {
                    if (t.type === 'income') {
                        income += t.amount;
                    } else {
                        totalSpending += t.amount;
                        
                        const isCC = t.paymentMethod === 'cc';
                        
                        // Bank account outflow
                        if (!isCC) {
                            bankSpending += t.amount;
                        }

                        // Isolated credit card progress
                        if (t.category === 'Credit Card Repayment') {
                            ccRepayments += t.amount;
                        } else if (isCC) {
                            ccPurchases += t.amount;
                        }
                    }
                });
                
                const cashBalance = income - bankSpending;
                
                // Update 3-metric summary
                document.getElementById('totalIncome').textContent = `£${income.toFixed(2)}`;
                document.getElementById('bankSpending').textContent = `£${bankSpending.toFixed(2)}`;
                document.getElementById('totalSpending').textContent = `£${totalSpending.toFixed(2)}`;
                
                // Cash-in-Bank Balance card
                const balanceEl = document.getElementById('balanceValue');
                balanceEl.textContent = `£${Math.abs(cashBalance).toFixed(2)}`;
                balanceEl.className = `balance-value ${cashBalance >= 0 ? 'positive' : 'negative'}`;

                // Update Credit Card Progress Card
                const ccNet = ccRepayments - ccPurchases;
                const ccProgressEl = document.getElementById('ccProgress');
                const ccStatusEl = document.getElementById('ccStatus');
                
                document.getElementById('ccTotalRepaid').textContent = `£${ccRepayments.toFixed(2)}`;
                document.getElementById('ccTotalSpent').textContent = `£${ccPurchases.toFixed(2)}`;

                if (ccRepayments === 0 && ccPurchases === 0) {
                    ccProgressEl.textContent = '£0.00';
                    ccProgressEl.className = 'cc-progress-badge';
                    ccStatusEl.textContent = 'No credit card transactions this month';
                    ccStatusEl.style.color = '#6e5e4d';
                } else if (ccNet >= 0) {
                    ccProgressEl.textContent = `+£${ccNet.toFixed(2)}`;
                    ccProgressEl.className = 'cc-progress-badge positive';
                    ccStatusEl.textContent = `Progress: Card balance reduced by £${ccNet.toFixed(2)}`;
                    ccStatusEl.style.color = '#2e6622';
                } else {
                    ccProgressEl.textContent = `-£${Math.abs(ccNet).toFixed(2)}`;
                    ccProgressEl.className = 'cc-progress-badge negative';
                    ccStatusEl.textContent = `Warning: Card balance increased by £${Math.abs(ccNet).toFixed(2)}`;
                    ccStatusEl.style.color = '#8a3311';
                }
                
                const sorted = activeInRange.sort((a, b) => new Date(b.date) - new Date(a.date));
                const toggleBtn = document.getElementById('btnToggleAll');

                if (sorted.length === 0) {
                    document.getElementById('recentList').innerHTML = '<p style="color: #8a7a68; font-size: 13px;">No transactions recorded this period.</p>';
                    toggleBtn.style.display = 'none';
                    return;
                }

                const visible = showAllTransactions ? sorted : sorted.slice(0, 10);
                
                if (sorted.length > 10) {
                    toggleBtn.style.display = 'block';
                    toggleBtn.textContent = showAllTransactions 
                        ? 'Show Recent 10 Only' 
                        : `Show All (${sorted.length}) Transactions`;
                } else {
                    toggleBtn.style.display = 'none';
                }

                document.getElementById('recentList').innerHTML = visible.map(t => {
                    const cleanNotes = (t.notes || '').trim();
                    const notesHTML = cleanNotes 
                        ? `<div class="transaction-notes">“${escapeHTML(cleanNotes)}”</div>` 
                        : '';
                    
                    const isCC = t.paymentMethod === 'cc';
                    const badge = t.type === 'income' 
                        ? '' 
                        : `<span class="badge ${isCC ? 'badge-cc' : 'badge-bank'}">${isCC ? 'Credit Card' : 'Bank'}</span>`;

                    return `
                        <div class="transaction">
                            <div class="transaction-info">
                                <div class="transaction-category">${escapeHTML(t.category)} ${badge}</div>
                                <div class="transaction-date">${new Date(t.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</div>
                                ${notesHTML}
                            </div>
                            <div class="transaction-actions">
                                <div class="transaction-amount ${t.type}">
                                    ${t.type === 'income' ? '+' : '-'}£${t.amount.toFixed(2)}
                                </div>
                                <button class="btn-delete" onclick="softDeleteTransaction(${t.id})" title="Remove item">✕</button>
                            </div>
                        </div>
                    `;
                }).join('');
            };
        }
        
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag));
        }
        
        async function addTransaction() {
            const type = document.getElementById('type').value;
            const paymentMethod = type === 'spending' ? document.getElementById('paymentMethod').value : 'bank';
            const category = document.getElementById('category').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const dateVal = document.getElementById('date').value;
            const notes = document.getElementById('notes').value.trim();
            
            if (isNaN(amount) || amount <= 0) {
                showMessage('Please enter a valid amount greater than zero.', true);
                return;
            }
            
            if (!dateVal) {
                showMessage('Please choose a valid date.', true);
                return;
            }

            if ((category === 'Credit Card Repayment' || category === 'Other Debt / Loans') && paymentMethod === 'cc') {
                showMessage('Debt payments cannot be made using a credit card.', true);
                return;
            }
            
            const [y, m, d] = dateVal.split('-').map(Number);
            const entryDate = new Date(y, m - 1, d, 12, 0, 0).toISOString();
            
            const transaction = {
                type,
                paymentMethod,
                category,
                amount: Math.round(amount * 100) / 100,
                date: entryDate,
                notes,
                synced: false,
                deleted: false,
                createdAt: new Date().toISOString()
            };
            
            const tx = db.transaction([STORE_NAME], 'readwrite');
            tx.objectStore(STORE_NAME).add(transaction);
            
            tx.oncomplete = () => {
                showMessage('Transaction added successfully.');
                document.getElementById('amount').value = '';
                document.getElementById('notes').value = '';
                refreshViews();
            };
        }

        function softDeleteTransaction(id) {
            if (!confirm('Are you sure you want to remove this transaction?')) return;

            const tx = db.transaction([STORE_NAME], 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const getRequest = store.get(id);

            getRequest.onsuccess = () => {
                const item = getRequest.result;
                if (!item) return;

                item.deleted = true;
                item.deletedAt = new Date().toISOString();
                store.put(item);
            };

            tx.oncomplete = () => {
                showMessage('Transaction removed.');
                refreshViews();
            };

            tx.onerror = () => {
                showMessage('Could not remove transaction.', true);
            };
        }
        
        function saveSettings() {
            const dayInput = parseInt(document.getElementById('monthStartDay').value, 10);
            if (dayInput < 1 || dayInput > 28) {
                alert('Please pick a month start day between 1 and 28 to ensure clean monthly cycles.');
                return;
            }
            localStorage.setItem('monthStartDay', dayInput);
            updateMonthRange();
            refreshViews();
            showMessage('Settings saved.');
        }
        
        function exportToCSV() {
            const tx = db.transaction([STORE_NAME], 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const request = store.getAll();
            
            request.onsuccess = () => {
                const unsynced = request.result.filter(t => !t.synced && !t.deleted);
                if (unsynced.length === 0) {
                    showMessage('No new unexported transactions.', true);
                    return;
                }
                
                let csv = 'Type,PaymentMethod,Category,Amount,Date,Notes\r\n';
                unsynced.forEach(t => {
                    const formattedDate = new Date(t.date).toLocaleDateString('en-GB');
                    const cleanNotes = (t.notes || '').replace(/"/g, '""');
                    csv += `"${t.type}","${t.paymentMethod || 'bank'}","${t.category}","${t.amount.toFixed(2)}","${formattedDate}","${cleanNotes}"\r\n`;
                });
                
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `finance_export_${new Date().toISOString().slice(0, 10)}.csv`;
                link.click();
                URL.revokeObjectURL(url);
                
                const updateTx = db.transaction([STORE_NAME], 'readwrite');
                const updateStore = updateTx.objectStore(STORE_NAME);
                unsynced.forEach(t => {
                    t.synced = true;
                    updateStore.put(t);
                });
                
                updateTx.oncomplete = () => {
                    showMessage(`Exported ${unsynced.length} transactions.`);
                };
            };
        }
        
        function updateCategories() {
            const type = document.getElementById('type').value;
            const categorySelect = document.getElementById('category');
            const paymentMethodGroup = document.getElementById('paymentMethodGroup');
            
            if (type === 'income') {
                paymentMethodGroup.style.display = 'none';
            } else {
                paymentMethodGroup.style.display = 'block';
            }
            
            categorySelect.innerHTML = '';
            
            categories[type].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                categorySelect.appendChild(opt);
            });
        }
        
        document.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            
            const savedDay = localStorage.getItem('monthStartDay') || '1';
            document.getElementById('monthStartDay').value = savedDay;
            
            const today = new Date();
            const localDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            document.getElementById('date').value = localDate;
            
            updateCategories();
            updateMonthRange();
            refreshViews();
        });
    </script>
</body>
</html>
